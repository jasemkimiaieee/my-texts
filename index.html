<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ثبت متن</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>ثبت متن</h1>

    <textarea
      id="textInput"
      placeholder="متن خود را همراه با کد وارد کنید..."
    ></textarea>

    <button id="submitBtn">
      ارسال
    </button>

    <p id="message"></p>

    <hr>

    <h2>متن‌های ثبت‌شده</h2>

    <div id="texts">
      در حال دریافت متن‌ها...
    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
