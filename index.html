<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ثبت متن</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Loading -->
  <div id="loadingScreen">
    <div class="loader"></div>
    <div class="loadingText">در حال دریافت متن‌ها...</div>
  </div>


  <!-- Main page -->
  <main id="mainContent" class="hidden">

    <div class="container">

      <h1>ثبت متن</h1>

      <textarea
        id="textInput"
        placeholder="متن خود را همراه با کد وارد کنید..."
      ></textarea>

      <button id="submitBtn">
        ارسال
      </button>

      <p id="message"></p>

      <hr>

      <h2>متن‌های ثبت‌شده</h2>

      <div id="texts"></div>

    </div>

  </main>


  <script src="script.js"></script>

</body>

</html>
